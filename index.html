<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Arcade</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            color: #f8fafc;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 2rem;
        }


        .container {

            text-align: center;

            background:
                rgba(30, 41, 59, 0.7);

            padding: 3rem;

            border-radius: 16px;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.3);

            backdrop-filter: blur(10px);

            max-width: 600px;

            width: 100%;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);
        }


        h1 {

            font-size: 2.2rem;

            margin-bottom: 0.5rem;

            color: #38bdf8;
        }


        p {

            color: #94a3b8;

            margin-bottom: 2rem;

            font-size: 1.05rem;
        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );

            gap: 1rem;
        }


        .btn {

            display: block;

            background-color: #38bdf8;

            color: #0f172a;

            padding: 0.8rem 1.5rem;

            font-size: 1rem;

            font-weight: bold;

            text-decoration: none;

            border-radius: 8px;

            transition:
                background-color 0.3s ease,
                transform 0.2s ease;

            box-shadow:
                0 4px 12px
                rgba(56, 189, 248, 0.3);

            text-align: center;

            border: none;

            cursor: pointer;
        }


        .btn:hover {

            background-color: #0ea5e9;

            transform: translateY(-2px);
        }


        /* =========================
           STATS BUTTON
           ========================= */

        .stats-btn {

            background-color: #8b5cf6;

            color: white;

            box-shadow:
                0 4px 12px
                rgba(139, 92, 246, 0.3);
        }


        .stats-btn:hover {

            background-color: #7c3aed;
        }


        /* =========================
           STATS OVERLAY
           ========================= */

        .stats-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.7);

            backdrop-filter: blur(8px);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 1000;
        }


        .stats-overlay.active {

            display: flex;
        }


        /* =========================
           STATS BOX
           ========================= */

        .stats-box {

            background: #1e293b;

            width: 100%;

            max-width: 600px;

            max-height: 85vh;

            overflow-y: auto;

            border-radius: 16px;

            padding: 2rem;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.5);
        }


        .stats-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 1.5rem;
        }


        .stats-header h2 {

            color: #a78bfa;
        }


        .close-btn {

            background: none;

            border: none;

            color: #94a3b8;

            font-size: 1.8rem;

            cursor: pointer;
        }


        .close-btn:hover {

            color: white;
        }


        /* =========================
           STAT SECTIONS
           ========================= */

        .stat-section {

            background:
                rgba(15, 23, 42, 0.7);

            border-radius: 12px;

            padding: 1.2rem;

            margin-bottom: 1rem;
        }


        .stat-section h3 {

            color: #38bdf8;

            margin-bottom: 1rem;
        }


        .stat-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0.7rem 0;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.06);
        }


        .stat-row:last-child {

            border-bottom: none;
        }


        .stat-name {

            color: #e2e8f0;
        }


        .stat-number {

            color: #38bdf8;

            font-weight: bold;
        }


        .loading {

            color: #94a3b8;

            text-align: center;

            padding: 1rem;
        }


        .error {

            color: #f87171;

            text-align: center;

            padding: 1rem;
        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN WEBSITE
         ========================= -->

    <div class="container">

        <h1>school organiser</h1>

        <p>school work apps</p>


        <div class="grid">


            <a
                href="https://karz-dev.github.io/x8Qm2vL7pR4k9zN3/"
                class="btn game-btn"
                data-game="Google Docs"
            >
                Google Docs
            </a>


            <a
                href="https://karz-dev.github.io/jK9sP2vL4mQx8RtY/"
                class="btn game-btn"
                data-game="Gmail"
            >
                Gmail
            </a>


            <a
                href="https://karz-dev.github.io/GDWAVE/"
                class="btn game-btn"
                data-game="Bromcom"
            >
                Bromcom
            </a>


            <a
                href="https://karz-dev.github.io/agario/"
                class="btn game-btn"
                data-game="SUPER study app"
            >
                SUPER study app
            </a>


            <button
                class="btn stats-btn"
                onclick="openStats()"
            >
                📊 Stats
            </button>


        </div>

    </div>



    <!-- =========================
         STATS WINDOW
         ========================= -->

    <div
        class="stats-overlay"
        id="statsOverlay"
        onclick="closeStatsOutside(event)"
    >


        <div class="stats-box">


            <div class="stats-header">

                <h2>📊 Game Stats</h2>

                <button
                    class="close-btn"
                    onclick="closeStats()"
                >
                    ×
                </button>

            </div>


            <!-- MOST PLAYED -->

            <div class="stat-section">

                <h3>🎮 Most Played</h3>

                <div id="mostPlayed">

                    <div class="loading">
                        Loading...
                    </div>

                </div>

            </div>


            <!-- UNIQUE BROWSERS -->

            <div class="stat-section">

                <h3>🌐 Browsers</h3>

                <div id="browserCount">

                    <div class="loading">
                        Loading...
                    </div>

                </div>

            </div>


        </div>

    </div>



    <!-- =========================
         SUPABASE LIBRARY
         ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>



    <script>


        /* =========================
           SUPABASE CONNECTION
           ========================= */

        const SUPABASE_URL =
            "https://jgpuhvhdobcgeqesnxip.supabase.co";


        /*
         * PUT YOUR PUBLISHABLE KEY
         * BETWEEN THESE QUOTES.
         */

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_ZhqSNWqW-IZzaNZG_pMKgg_rqaVd4yq";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );



        /* =========================
           CREATE BROWSER ID
           ========================= */

        let browserID =
            localStorage.getItem(
                "schoolOrganiserBrowserID"
            );


        if (!browserID) {

            browserID =
                crypto.randomUUID();


            localStorage.setItem(
                "schoolOrganiserBrowserID",
                browserID
            );

        }



        /* =========================
           TRACK GAME CLICKS
           ========================= */

        document
            .querySelectorAll(".game-btn")
            .forEach(button => {


                button.addEventListener(
                    "click",
                    async function(event) {


                        /*
                         * Stop the page from opening
                         * until the play is recorded.
                         */

                        event.preventDefault();


                        const game =
                            this.dataset.game;


                        const destination =
                            this.href;


                        const { error } =
                            await supabaseClient
                                .from("game_plays")
                                .insert({

                                    browser_id:
                                        browserID,

                                    game:
                                        game

                                });


                        if (error) {

                            console.error(
                                "Stats error:",
                                error
                            );

                        }


                        /*
                         * Open the game.
                         */

                        window.location.href =
                            destination;

                    }

                );

            });



        /* =========================
           OPEN STATS
           ========================= */

        function openStats() {

            document
                .getElementById(
                    "statsOverlay"
                )
                .classList
                .add("active");


            loadStats();

        }



        /* =========================
           CLOSE STATS
           ========================= */

        function closeStats() {

            document
                .getElementById(
                    "statsOverlay"
                )
                .classList
                .remove("active");

        }



        /* =========================
           CLOSE BY CLICKING OUTSIDE
           ========================= */

        function closeStatsOutside(event) {

            if (
                event.target.id ===
                "statsOverlay"
            ) {

                closeStats();

            }

        }



        /* =========================
           LOAD STATS
           ========================= */

        async function loadStats() {


            const mostPlayed =
                document.getElementById(
                    "mostPlayed"
                );


            const browserCount =
                document.getElementById(
                    "browserCount"
                );


            mostPlayed.innerHTML =
                '<div class="loading">Loading...</div>';


            browserCount.innerHTML =
                '<div class="loading">Loading...</div>';



            /* =========================
               GET PLAYS FROM SUPABASE
               ========================= */

            const { data, error } =
                await supabaseClient
                    .from("game_plays")
                    .select(
                        "browser_id, game"
                    );


            if (error) {

                console.error(
                    "Could not load stats:",
                    error
                );


                mostPlayed.innerHTML =
                    `
                    <div class="error">
                        Stats unavailable.
                    </div>
                    `;


                browserCount.innerHTML =
                    `
                    <div class="error">
                        Stats unavailable.
                    </div>
                    `;


                return;

            }



            /* =========================
               COUNT GAME PLAYS
               ========================= */

            const gameCounts = {};


            data.forEach(play => {


                if (
                    !gameCounts[play.game]
                ) {

                    gameCounts[play.game] =
                        0;

                }


                gameCounts[play.game]++;

            });



            /* =========================
               SORT MOST PLAYED
               ========================= */

            const sortedGames =
                Object.entries(gameCounts)
                    .sort(
                        (a, b) =>
                            b[1] - a[1]
                    );



            mostPlayed.innerHTML = "";



            if (
                sortedGames.length === 0
            ) {

                mostPlayed.innerHTML =
                    `
                    <div class="loading">

                        No games played yet.

                    </div>
                    `;

            }



            sortedGames.forEach(
                ([game, plays], index) => {


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "stat-row";


                    row.innerHTML = `

                        <span class="stat-name">

                            ${index + 1}.
                            ${game}

                        </span>


                        <span class="stat-number">

                            ${plays} plays

                        </span>

                    `;


                    mostPlayed.appendChild(
                        row
                    );

                }
            );



            /* =========================
               COUNT UNIQUE BROWSERS
               ========================= */

            const uniqueBrowsers =
                new Set(
                    data.map(
                        play =>
                            play.browser_id
                    )
                );


            browserCount.innerHTML = `

                <div class="stat-row">

                    <span class="stat-name">

                        Unique browsers

                    </span>


                    <span class="stat-number">

                        ${uniqueBrowsers.size}

                    </span>

                </div>

            `;

        }


    </script>


</body>

</html>
