<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Arcade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .btn {
            display: block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            text-align: center;
        }
        .btn:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }
        .btn.placeholder {
            background-color: rgba(255, 255, 255, 0.05);
            color: #64748b;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn.placeholder:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Arcade</h1>
        <p>Select a game to play below!</p>
        
        <div class="grid">
            <a href="https://karz-dev.github.io/x8Qm2vL7pR4k9zN3/" class="btn">Game 1</a>
            
            <a href="https://karz-dev.github.io/jK9sP2vL4mQx8RtY/" class="btn">Game 2</a>
            <a href="#" class="btn placeholder">Coming Soon...</a>
            <a href="#" class="btn placeholder">Coming Soon...</a>
        </div>
    </div>

</body>
</html>
